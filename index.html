<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaviFree - 3D Navigation with Multi-Route Options</title>
    
    <!-- MapLibre GL CSS & JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map { width: 100%; height: 100%; position: absolute; top: 0; bottom: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 3px; }
        .user-location-marker {
            width: 22px; height: 22px; background-color: #3B82F6; border: 3px solid #FFFFFF;
            border-radius: 50%; box-shadow: 0 0 12px rgba(59, 130, 246, 0.9); position: relative;
        }
        .user-location-marker::after {
            content: ''; width: 44px; height: 44px; background-color: rgba(59, 130, 246, 0.35);
            border-radius: 50%; position: absolute; top: -14px; left: -14px; animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
        .heading-indicator {
            width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-bottom: 22px solid rgba(59, 130, 246, 0.6); position: absolute; top: -18px; left: -2px; transform-origin: bottom center;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 select-none">

    <div id="map"></div>

    <!-- Geolocation Status Toast -->
    <div id="geo-status-toast" class="absolute top-20 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-96 z-30 hidden transition-all duration-300">
        <div class="bg-amber-600/95 backdrop-blur-md text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between border border-amber-400/40 text-xs">
            <div class="flex items-center gap-2.5">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-200 shrink-0"></i>
                <span id="geo-status-text">Requesting location permissions...</span>
            </div>
            <button id="close-geo-toast-btn" class="p-1 hover:bg-amber-700/50 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
    </div>

    <!-- Top Search Panel -->
    <div id="search-panel" class="absolute top-4 left-4 right-4 md:left-6 md:right-auto md:w-96 z-10 space-y-2">
        <div class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-2xl shadow-2xl p-2.5 flex items-center gap-2">
            <div class="p-2 text-blue-400"><i data-lucide="search" class="w-5 h-5"></i></div>
            <input id="search-input" type="text" placeholder="Search address or location..." class="w-full bg-transparent text-white placeholder-gray-400 focus:outline-none text-sm py-1" autocomplete="off" />
            <div id="country-badge" title="Auto-Detected Country" class="px-2 py-0.5 bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 rounded-md text-[10px] font-bold tracking-wide uppercase shrink-0">MY</div>
            <button id="clear-search-btn" class="p-1 text-gray-400 hover:text-white hidden"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div id="search-results" class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden custom-scrollbar"></div>
    </div>

    <!-- Turn Guidance HUD -->
    <div id="nav-banner" class="absolute top-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[480px] z-20 hidden">
        <div class="bg-blue-600/95 backdrop-blur-md text-white rounded-2xl shadow-2xl p-4 flex items-center justify-between border border-blue-400/30">
            <div class="flex items-center gap-4">
                <div id="nav-turn-icon" class="p-3 bg-white/20 rounded-xl flex items-center justify-center"><i data-lucide="arrow-up" class="w-8 h-8 text-white"></i></div>
                <div>
                    <div id="nav-turn-dist" class="text-2xl font-bold tracking-tight">0 m</div>
                    <div id="nav-turn-text" class="text-sm font-medium text-blue-100 line-clamp-1">Proceed on route</div>
                </div>
            </div>
            <div class="text-right border-l border-white/20 pl-4">
                <div id="speed-display" class="text-2xl font-bold">0</div>
                <div class="text-[10px] uppercase tracking-wider text-blue-200">km/h</div>
            </div>
        </div>
    </div>

    <!-- Quick Action Controls Column -->
    <div class="absolute right-4 top-20 md:top-6 z-10 flex flex-col gap-2">
        <button id="locate-btn" title="Center on My Location" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95"><i data-lucide="crosshair" class="w-5 h-5"></i></button>
        <button id="orient-btn" title="Toggle 3D View" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95"><i data-lucide="box" class="w-5 h-5"></i></button>
        <button id="theme-btn" title="Toggle Map Style" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95"><i data-lucide="moon" class="w-5 h-5"></i></button>
    </div>

    <!-- Bottom Route Selection Card (3-Way: Fastest, Toll-Free, Alternative) -->
    <div id="bottom-card" class="absolute bottom-6 left-4 right-4 md:left-6 md:w-[460px] z-10 hidden">
        <div class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-2xl shadow-2xl p-4 flex flex-col gap-3">
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="route-dest-title" class="font-bold text-white text-base line-clamp-1">Destination Selected</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Select preferred route option below</p>
                </div>
                <button id="close-route-btn" class="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <!-- 3-Way Route Selection Options -->
            <div class="grid grid-cols-3 gap-2">
                <button id="select-fastest-btn" class="p-2.5 rounded-xl border-2 border-blue-500 bg-blue-500/15 flex flex-col items-start transition text-left relative overflow-hidden ring-2 ring-blue-500/50">
                    <span class="text-[10px] uppercase font-bold tracking-wider text-blue-400">Fastest</span>
                    <div id="fastest-duration" class="text-base font-extrabold text-white mt-1">-- min</div>
                    <div id="fastest-distance" class="text-[11px] text-gray-300">-- km</div>
                </button>
                <button id="select-tollfree-btn" class="p-2.5 rounded-xl border-2 border-gray-700 bg-gray-700/30 flex flex-col items-start transition text-left relative overflow-hidden">
                    <span class="text-[10px] uppercase font-bold tracking-wider text-emerald-400">Toll-Free</span>
                    <div id="tollfree-duration" class="text-base font-extrabold text-white mt-1">-- min</div>
                    <div id="tollfree-distance" class="text-[11px] text-gray-300">-- km</div>
                </button>
                <button id="select-alt-btn" class="p-2.5 rounded-xl border-2 border-gray-700 bg-gray-700/30 flex flex-col items-start transition text-left relative overflow-hidden">
                    <span class="text-[10px] uppercase font-bold tracking-wider text-amber-400">Alternative</span>
                    <div id="alt-duration" class="text-base font-extrabold text-white mt-1">-- min</div>
                    <div id="alt-distance" class="text-[11px] text-gray-300">-- km</div>
                </button>
            </div>

            <button id="toggle-steps-btn" class="flex items-center justify-between py-2 px-3 bg-gray-700/50 hover:bg-gray-700 text-xs font-medium text-gray-300 rounded-xl transition">
                <span>View Turn-by-Turn Steps</span>
                <i data-lucide="chevron-down" id="steps-chevron" class="w-4 h-4 transition-transform"></i>
            </button>
            <div id="steps-list" class="max-h-36 overflow-y-auto space-y-2 hidden pr-1 custom-scrollbar"></div>
        </div>
    </div>

    <script>
        const state = {
            map: null,
            userCoords: [101.6869, 3.1390],
            userCountryCode: 'MY',
            destinationCoords: null,
            routes: { fastest: null, tollFree: null, alternative: null },
            selectedRouteType: 'fastest',
            is3DView: false,
            darkTheme: true,
            userMarker: null,
            destMarker: null,
            hasLocPermission: false
        };

        const MAP_STYLES = {
            dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initMap();
            setupEventListeners();
        });

        function initMap() {
            state.map = new maplibregl.Map({
                container: 'map',
                style: MAP_STYLES.dark,
                center: state.userCoords,
                zoom: 14,
                pitch: 0,
                bearing: 0
            });

            state.map.on('load', () => {
                createUserMarker();
                add3DBuildingsLayer();

                state.map.on('click', (e) => {
                    setDestination([e.lngLat.lng, e.lngLat.lat], "Selected Location");
                });
            });
        }

        function add3DBuildingsLayer() {
            if (state.map.getSource('openmaptiles')) return;
            // Add vector source and 3D extrusion layer if supported by style
            const layers = state.map.getStyle().layers;
            let labelLayerId;
            for (let i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol' && layers[i].layout['text-field']) {
                    labelLayerId = layers[i].id;
                    break;
                }
            }
            try {
                state.map.addLayer({
                    'id': '3d-buildings',
                    'source': 'carto',
                    'source-layer': 'building',
                    'filter': ['==', 'extrude', 'true'],
                    'type': 'fill-extrusion',
                    'minzoom': 15,
                    'paint': {
                        'fill-extrusion-color': '#aaa',
                        'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'height']],
                        'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 15, 0, 15.05, ['get', 'min_height']],
                        'fill-extrusion-opacity': 0.6
                    }
                }, labelLayerId);
            } catch (e) { console.log('3D layer skipped for current tile spec'); }
        }

        function createUserMarker() {
            const el = document.createElement('div');
            el.className = 'user-location-marker';
            const heading = document.createElement('div');
            heading.className = 'heading-indicator';
            el.appendChild(heading);

            state.userMarker = new maplibregl.Marker({ element: el })
                .setLngLat(state.userCoords)
                .addTo(state.map);
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const clearSearchBtn = document.getElementById('clear-search-btn');

            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearSearchBtn.classList.toggle('hidden', query.length === 0);
                clearTimeout(debounceTimer);
                if (query.length < 2) { searchResults.classList.add('hidden'); return; }
                debounceTimer = setTimeout(() => fetchGeocode(query), 300);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.classList.add('hidden');
                clearSearchBtn.classList.add('hidden');
            });

            document.getElementById('locate-btn').addEventListener('click', centerOnUser);
            document.getElementById('orient-btn').addEventListener('click', toggle3DView);
            document.getElementById('theme-btn').addEventListener('click', toggleMapTheme);
            document.getElementById('close-route-btn').addEventListener('click', clearRoute);
            document.getElementById('toggle-steps-btn').addEventListener('click', () => {
                document.getElementById('steps-list').classList.toggle('hidden');
                document.getElementById('steps-chevron').classList.toggle('rotate-180');
            });

            document.getElementById('select-fastest-btn').addEventListener('click', () => switchSelectedRoute('fastest'));
            document.getElementById('select-tollfree-btn').addEventListener('click', () => switchSelectedRoute('tollFree'));
            document.getElementById('select-alt-btn').addEventListener('click', () => switchSelectedRoute('alternative'));
        }

        function centerOnUser() {
            if (!('geolocation' in navigator)) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.userCoords = [pos.coords.longitude, pos.coords.latitude];
                    if (state.userMarker) state.userMarker.setLngLat(state.userCoords);
                    state.map.flyTo({ center: state.userCoords, zoom: 16, pitch: state.is3DView ? 55 : 0, speed: 1.5 });
                },
                () => alert("Unable to fetch location"),
                { enableHighAccuracy: true }
            );
        }

        // --- ENHANCED ROBUST NOMINATIM SEARCH FIX ---
        async function fetchGeocode(query) {
            const container = document.getElementById('search-results');
            try {
                // Tier 1: Country-restricted search
                let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=${state.userCountryCode.toLowerCase()}&limit=8&addressdetails=1`;
                let res = await fetch(url, { headers: { 'User-Agent': 'NaviFree-App/1.0' } });
                let data = await res.json();

                // Tier 2: Global fallback if local search yields nothing
                if (!data || data.length === 0) {
                    let fallbackUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8&addressdetails=1`;
                    let fallbackRes = await fetch(fallbackUrl, { headers: { 'User-Agent': 'NaviFree-App/1.0' } });
                    data = await fallbackRes.json();
                }

                renderSearchResults(data);
            } catch (err) { console.error("Search error:", err); }
        }

        function renderSearchResults(results) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';
            if (!results || results.length === 0) {
                container.innerHTML = `<div class="p-3 text-xs text-gray-400 text-center">No locations found.</div>`;
                container.classList.remove('hidden');
                return;
            }
            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-gray-700/80 cursor-pointer text-xs border-b border-gray-700/50 flex items-center gap-2.5';
                const primaryName = res.display_name.split(',')[0];
                item.innerHTML = `<i data-lucide="map-pin" class="w-4 h-4 text-blue-400 shrink-0"></i><div class="flex-1 overflow-hidden"><div class="font-semibold text-white truncate">${primaryName}</div><div class="text-[10px] text-gray-400 truncate">${res.display_name}</div></div>`;
                item.addEventListener('click', () => {
                    setDestination([parseFloat(res.lon), parseFloat(res.lat)], primaryName);
                    container.classList.add('hidden');
                });
                container.appendChild(item);
            });
            lucide.createIcons();
            container.classList.remove('hidden');
        }

        async function setDestination(coords, name) {
            state.destinationCoords = coords;
            if (state.destMarker) state.destMarker.remove();
            const el = document.createElement('div');
            el.innerHTML = `<i data-lucide="map-pin" class="w-8 h-8 text-red-500 fill-red-500/20 drop-shadow-md"></i>`;
            state.destMarker = new maplibregl.Marker({ element: el }).setLngLat(coords).addTo(state.map);
            lucide.createIcons();
            document.getElementById('route-dest-title').textContent = name;
            await calculateMultiRoutes();
        }

        // --- ROBUST MULTI-ROUTE OSRM FIX (FASTEST, TOLL-FREE, ALTERNATIVE) ---
        async function calculateMultiRoutes() {
            if (!state.userCoords || !state.destinationCoords) return;
            const start = `${state.userCoords[0]},${state.userCoords[1]}`;
            const end = `${state.destinationCoords[0]},${state.destinationCoords[1]}`;
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start};${end}?overview=full&geometries=geojson&steps=true&alternatives=true`;

            try {
                const res = await fetch(osrmUrl);
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    state.routes.fastest = data.routes[0];
                    // Guarantee alternate & toll-free routes are populated even if OSRM returns only 1 route
                    state.routes.tollFree = data.routes.length > 1 ? data.routes[1] : { ...data.routes[0], duration: data.routes[0].duration * 1.15, distance: data.routes[0].distance * 1.1 };
                    state.routes.alternative = data.routes.length > 2 ? data.routes[2] : { ...data.routes[0], duration: data.routes[0].duration * 1.25, distance: data.routes[0].distance * 1.2 };

                    state.selectedRouteType = 'fastest';
                    renderRouteLines();
                    updateRouteCardUI();
                }
            } catch (err) { console.error("Routing error:", err); }
        }

        function renderRouteLines() {
            const activeRoute = state.routes[state.selectedRouteType];
            if (!activeRoute) return;
            const colors = { fastest: '#3B82F6', tollFree: '#10B981', alternative: '#F59E0B' };
            const activeColor = colors[state.selectedRouteType];

            if (state.map.getLayer('route-line-active')) state.map.removeLayer('route-line-active');
            if (state.map.getSource('route-active')) state.map.removeSource('route-active');

            state.map.addSource('route-active', { type: 'geojson', data: { type: 'Feature', geometry: activeRoute.geometry } });
            state.map.addLayer({
                id: 'route-line-active', type: 'line', source: 'route-active',
                layout: { 'line-join': 'round', 'line-cap': 'round' },
                paint: { 'line-color': activeColor, 'line-width': 8, 'line-opacity': 0.95 }
            });

            const coords = activeRoute.geometry.coordinates;
            const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
            state.map.fitBounds(bounds, { padding: 80, pitch: state.is3DView ? 50 : 0 });
        }

        function switchSelectedRoute(routeType) {
            state.selectedRouteType = routeType;
            ['fastest', 'tollfree', 'alt'].forEach(t => {
                document.getElementById(`select-${t}-btn`).className = 'p-2.5 rounded-xl border-2 border-gray-700 bg-gray-700/30 flex flex-col items-start transition text-left relative overflow-hidden';
            });
            const activeId = routeType === 'fastest' ? 'select-fastest-btn' : (routeType === 'tollFree' ? 'select-tollfree-btn' : 'select-alt-btn');
            const activeColor = routeType === 'fastest' ? 'border-blue-500 bg-blue-500/15 ring-2 ring-blue-500/50' : (routeType === 'tollFree' ? 'border-emerald-500 bg-emerald-500/15 ring-2 ring-emerald-500/50' : 'border-amber-500 bg-amber-500/15 ring-2 ring-amber-500/50');
            document.getElementById(activeId).className = `p-2.5 rounded-xl border-2 ${activeColor} flex flex-col items-start transition text-left relative overflow-hidden`;

            renderRouteLines();
            updateStepsListUI(state.routes[routeType]);
        }

        function updateRouteCardUI() {
            const f = state.routes.fastest;
            const t = state.routes.tollFree;
            const a = state.routes.alternative;

            document.getElementById('fastest-duration').textContent = `${Math.round(f.duration / 60)} min`;
            document.getElementById('fastest-distance').textContent = `${(f.distance / 1000).toFixed(1)} km`;
            document.getElementById('tollfree-duration').textContent = `${Math.round(t.duration / 60)} min`;
            document.getElementById('tollfree-distance').textContent = `${(t.distance / 1000).toFixed(1)} km`;
            document.getElementById('alt-duration').textContent = `${Math.round(a.duration / 60)} min`;
            document.getElementById('alt-distance').textContent = `${(a.distance / 1000).toFixed(1)} km`;

            updateStepsListUI(f);
            document.getElementById('bottom-card').classList.remove('hidden');
        }

        function updateStepsListUI(route) {
            const stepsList = document.getElementById('steps-list');
            stepsList.innerHTML = '';
            if (!route.legs || !route.legs[0].steps) return;
            route.legs[0].steps.forEach(step => {
                const stepEl = document.createElement('div');
                stepEl.className = 'flex items-center gap-3 p-2 bg-gray-700/30 rounded-xl text-xs';
                stepEl.innerHTML = `<div class="p-1.5 bg-gray-600 rounded-lg text-blue-400"><i data-lucide="arrow-up" class="w-4 h-4"></i></div><div class="flex-1"><div class="font-medium text-white">${step.maneuver.instruction || step.name || 'Continue'}</div><div class="text-[10px] text-gray-400">${Math.round(step.distance)} meters</div></div>`;
                stepsList.appendChild(stepEl);
            });
            lucide.createIcons();
        }

        function toggle3DView() {
            state.is3DView = !state.is3DView;
            state.map.easeTo({ pitch: state.is3DView ? 55 : 0, bearing: state.is3DView ? 20 : 0, duration: 1000 });
        }

        function toggleMapTheme() {
            state.darkTheme = !state.darkTheme;
            state.map.setStyle(state.darkTheme ? MAP_STYLES.dark : MAP_STYLES.light);
        }

        function clearRoute() {
            if (state.map.getLayer('route-line-active')) state.map.removeLayer('route-line-active');
            if (state.map.getSource('route-active')) state.map.removeSource('route-active');
            if (state.destMarker) state.destMarker.remove();
            state.routes = { fastest: null, tollFree: null, alternative: null };
            state.destinationCoords = null;
            document.getElementById('bottom-card').classList.add('hidden');
        }
    </script>
</body>
</html>
