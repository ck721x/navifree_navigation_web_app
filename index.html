<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NaviFree - Turn-by-Turn Navigation</title>
    
    <!-- MapLibre GL CSS & JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
        }

        /* Custom scrollbar for instruction list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        /* Pulsing dot for GPS location marker */
        .user-location-marker {
            width: 20px;
            height: 20px;
            background-color: #3B82F6;
            border: 3px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            position: relative;
        }
        .user-location-marker::after {
            content: '';
            width: 40px;
            height: 40px;
            background-color: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            position: absolute;
            top: -13px;
            left: -13px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Heading Cone Indicator */
        .heading-indicator {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 24px solid rgba(59, 130, 246, 0.4);
            position: absolute;
            top: -20px;
            left: -2px;
            transform-origin: bottom center;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 select-none">

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Geolocation Status / Permission Alert Toast -->
    <div id="geo-status-toast" class="absolute top-20 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-96 z-30 hidden transition-all duration-300">
        <div class="bg-amber-600/95 backdrop-blur-md text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between border border-amber-400/40 text-xs">
            <div class="flex items-center gap-2.5">
                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-200 shrink-0"></i>
                <span id="geo-status-text">Requesting GPS location permissions...</span>
            </div>
            <button id="close-geo-toast-btn" class="p-1 hover:bg-amber-700/50 rounded-lg">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Top Floating Header Search Panel -->
    <div id="search-panel" class="absolute top-4 left-4 right-4 md:left-6 md:right-auto md:w-96 z-10 space-y-2">
        <div class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-2xl shadow-2xl p-2.5 flex items-center gap-2">
            <div class="p-2 text-blue-400">
                <i data-lucide="search" class="w-5 h-5"></i>
            </div>
            <input id="search-input" type="text" placeholder="Search address or building in Malaysia..." 
                   class="w-full bg-transparent text-white placeholder-gray-400 focus:outline-none text-sm py-1"
                   autocomplete="off" />
            <button id="clear-search-btn" class="p-1 text-gray-400 hover:text-white hidden">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Autocomplete Suggestions Dropdown -->
        <div id="search-results" class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden custom-scrollbar">
        </div>
    </div>

    <!-- Active Navigation Top Banner (Turn Instruction HUD) -->
    <div id="nav-banner" class="absolute top-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:w-[480px] z-20 hidden">
        <div class="bg-blue-600/95 backdrop-blur-md text-white rounded-2xl shadow-2xl p-4 flex items-center justify-between border border-blue-400/30">
            <div class="flex items-center gap-4">
                <div id="nav-turn-icon" class="p-3 bg-white/20 rounded-xl flex items-center justify-center">
                    <i data-lucide="arrow-up" class="w-8 h-8 text-white"></i>
                </div>
                <div>
                    <div id="nav-turn-dist" class="text-2xl font-bold tracking-tight">150 m</div>
                    <div id="nav-turn-text" class="text-sm font-medium text-blue-100 line-clamp-1">Turn right onto Main Street</div>
                </div>
            </div>
            <div class="text-right border-l border-white/20 pl-4">
                <div id="speed-display" class="text-2xl font-bold">0</div>
                <div class="text-[10px] uppercase tracking-wider text-blue-200">km/h</div>
            </div>
        </div>
    </div>

    <!-- Right Quick Controls Stack -->
    <div class="absolute right-4 top-20 md:top-6 z-10 flex flex-col gap-2">
        <button id="locate-btn" title="Center on Location" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95">
            <i data-lucide="crosshair" class="w-5 h-5"></i>
        </button>
        <button id="orient-btn" title="Toggle Heading Orientation" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95">
            <i data-lucide="compass" class="w-5 h-5"></i>
        </button>
        <button id="theme-btn" title="Toggle Map Style (Light/Dark)" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-white rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95">
            <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button id="voice-btn" title="Toggle Voice Guidance" class="p-3 bg-gray-800/90 hover:bg-gray-700 backdrop-blur-md text-blue-400 rounded-xl shadow-lg border border-gray-700/80 transition active:scale-95">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
        </button>
    </div>

    <!-- Bottom Action Card (Route Preview & Directions List) -->
    <div id="bottom-card" class="absolute bottom-6 left-4 right-4 md:left-6 md:w-96 z-10 hidden">
        <div class="bg-gray-800/95 backdrop-blur-md border border-gray-700/80 rounded-2xl shadow-2xl p-4 flex flex-col gap-3">
            <!-- Route Summary Header -->
            <div class="flex justify-between items-start">
                <div>
                    <h3 id="route-dest-title" class="font-bold text-white text-base line-clamp-1">Destination Selected</h3>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span id="route-duration" class="text-emerald-400 font-bold text-lg">-- min</span>
                        <span class="text-gray-400 text-sm">•</span>
                        <span id="route-distance" class="text-gray-300 text-sm font-medium">-- km</span>
                    </div>
                </div>
                <button id="close-route-btn" class="p-1 text-gray-400 hover:text-white rounded-lg hover:bg-gray-700">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Route Steps Preview Toggle -->
            <button id="toggle-steps-btn" class="flex items-center justify-between py-2 px-3 bg-gray-700/50 hover:bg-gray-700 text-xs font-medium text-gray-300 rounded-xl transition">
                <span>View Turn-by-Turn Steps</span>
                <i data-lucide="chevron-down" id="steps-chevron" class="w-4 h-4 transition-transform"></i>
            </button>

            <!-- Turn-by-Turn Instruction List -->
            <div id="steps-list" class="max-h-48 overflow-y-auto space-y-2 hidden pr-1 custom-scrollbar">
            </div>

            <!-- Main Action Buttons -->
            <div class="grid grid-cols-2 gap-2 pt-1">
                <button id="sim-btn" class="py-2.5 px-3 bg-gray-700 hover:bg-gray-600 text-white rounded-xl text-xs font-bold tracking-wide flex items-center justify-center gap-1.5 transition active:scale-95">
                    <i data-lucide="play-circle" class="w-4 h-4"></i>
                    Simulate
                </button>
                <button id="start-nav-btn" class="py-2.5 px-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold tracking-wide flex items-center justify-center gap-1.5 transition shadow-lg shadow-blue-600/30 active:scale-95">
                    <i data-lucide="navigation" class="w-4 h-4"></i>
                    Start Nav
                </button>
            </div>
        </div>
    </div>

    <!-- Active Navigation Control Floating Button -->
    <div id="active-nav-controls" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 hidden flex items-center gap-3">
        <button id="stop-nav-btn" class="py-3 px-6 bg-red-600 hover:bg-red-500 text-white rounded-full font-bold text-sm shadow-xl flex items-center gap-2 border border-red-400/40 active:scale-95">
            <i data-lucide="square" class="w-4 h-4 fill-current"></i>
            Exit Navigation
        </button>
    </div>

    <script>
        // State Management
        const state = {
            map: null,
            userCoords: [101.6869, 3.1390], // Default fallback: Kuala Lumpur
            destinationCoords: null,
            routeData: null,
            currentStepIndex: 0,
            isNavigating: false,
            isSimulating: false,
            simulationInterval: null,
            simStepIndex: 0,
            simProgress: 0,
            voiceEnabled: true,
            followUser: true,
            darkTheme: true,
            userMarker: null,
            destMarker: null,
            lastSpokenStep: -1,
            watchPositionId: null,
            hasLocPermission: false
        };

        // CartoDB Tile Styles
        const MAP_STYLES = {
            dark: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            light: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Prevent MapLibre from attempting cross-origin window access in constrained iframes
            try {
                if (window.self !== window.top) {
                    Object.defineProperty(window, 'parent', { value: window, writable: false });
                }
            } catch (e) {
                // Security context prevents property definition, fallback continues gracefully
            }

            initMap();
            setupEventListeners();
            setupGeolocation();
        });

        // Initialize MapLibre Engine safely
        function initMap() {
            state.map = new maplibregl.Map({
                container: 'map',
                style: MAP_STYLES.dark,
                center: state.userCoords,
                zoom: 14,
                pitch: 0,
                bearing: 0,
                trackResize: true
            });

            // Add standard zoom/pitch controls
            state.map.addControl(new maplibregl.NavigationControl({ showCompass: true, showZoom: true }), 'bottom-right');

            state.map.on('load', () => {
                createUserMarker();
                
                // Map click for selecting destination directly
                state.map.on('click', (e) => {
                    if (state.isNavigating) return;
                    setDestination([e.lngLat.lng, e.lngLat.lat], "Selected Location");
                });
            });
        }

        function createUserMarker() {
            const el = document.createElement('div');
            el.className = 'user-location-marker';
            const heading = document.createElement('div');
            heading.className = 'heading-indicator';
            el.appendChild(heading);

            state.userMarker = new maplibregl.Marker({ element: el })
                .setLngLat(state.userCoords)
                .addTo(state.map);
        }

        function setupEventListeners() {
            // Address Search Input Auto-complete
            const searchInput = document.getElementById('search-input');
            const searchResults = document.getElementById('search-results');
            const clearSearchBtn = document.getElementById('clear-search-btn');

            let debounceTimer;
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearSearchBtn.classList.toggle('hidden', query.length === 0);

                clearTimeout(debounceTimer);
                if (query.length < 2) {
                    searchResults.classList.add('hidden');
                    return;
                }

                debounceTimer = setTimeout(() => fetchGeocode(query), 300);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchResults.classList.add('hidden');
                clearSearchBtn.classList.add('hidden');
            });

            // Map Quick Buttons
            document.getElementById('locate-btn').addEventListener('click', centerOnUser);
            document.getElementById('orient-btn').addEventListener('click', toggleMapOrientation);
            document.getElementById('theme-btn').addEventListener('click', toggleMapTheme);
            document.getElementById('voice-btn').addEventListener('click', toggleVoiceGuidance);
            document.getElementById('close-geo-toast-btn').addEventListener('click', hideGeoToast);

            // Route Actions
            document.getElementById('close-route-btn').addEventListener('click', clearRoute);
            document.getElementById('toggle-steps-btn').addEventListener('click', toggleStepsList);
            document.getElementById('start-nav-btn').addEventListener('click', () => startNavigation(false));
            document.getElementById('sim-btn').addEventListener('click', () => startNavigation(true));
            document.getElementById('stop-nav-btn').addEventListener('click', stopNavigation);
        }

        function setupGeolocation() {
            if ('geolocation' in navigator) {
                state.watchPositionId = navigator.geolocation.watchPosition(
                    (pos) => {
                        state.hasLocPermission = true;
                        const coords = [pos.coords.longitude, pos.coords.latitude];
                        updateUserPosition(coords, pos.coords.heading, pos.coords.speed);
                    },
                    (err) => {
                        console.warn('Geolocation warning/error:', err.message);
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );
            } else {
                showGeoToast("Geolocation is not supported by your browser.");
            }
        }

        function centerOnUser() {
            state.followUser = true;

            if (!('geolocation' in navigator)) {
                showGeoToast("Geolocation is not supported by your browser.");
                return;
            }

            showGeoToast("Locating your exact position...");

            // Query live GPS coordinates with high accuracy
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.hasLocPermission = true;
                    hideGeoToast();
                    const coords = [pos.coords.longitude, pos.coords.latitude];
                    
                    // Update internal state and marker position with actual GPS position
                    updateUserPosition(coords, pos.coords.heading, pos.coords.speed);

                    // Smoothly fly camera directly to true GPS coordinates
                    state.map.flyTo({ 
                        center: coords, 
                        zoom: 17,
                        speed: 1.4,
                        essential: true 
                    });
                },
                (err) => {
                    let errMsg = "Unable to access your location.";
                    if (err.code === err.PERMISSION_DENIED) {
                        errMsg = "Location permission was denied. Please allow location access in browser settings.";
                    } else if (err.code === err.POSITION_UNAVAILABLE) {
                        errMsg = "Location unavailable. Please ensure device GPS is turned on.";
                    } else if (err.code === err.TIMEOUT) {
                        errMsg = "Location request timed out. Please try again.";
                    }
                    showGeoToast(errMsg);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function showGeoToast(message) {
            const toast = document.getElementById('geo-status-toast');
            document.getElementById('geo-status-text').textContent = message;
            toast.classList.remove('hidden');
        }

        function hideGeoToast() {
            document.getElementById('geo-status-toast').classList.add('hidden');
        }

        function updateUserPosition(coords, heading = 0, speedMs = 0) {
            state.userCoords = coords;
            if (state.userMarker) {
                state.userMarker.setLngLat(coords);
            }

            // Update Speed HUD
            const speedKmh = Math.max(0, Math.round((speedMs || 0) * 3.6));
            document.getElementById('speed-display').textContent = speedKmh;

            // Camera follow logic during navigation
            if (state.isNavigating && state.followUser) {
                state.map.easeTo({
                    center: coords,
                    zoom: 17,
                    pitch: 50,
                    bearing: heading || state.map.getBearing(),
                    duration: 1000
                });

                checkNavigationProgress(coords);
            }
        }

        async function fetchGeocode(query) {
            try {
                // Determine user proximity bounding box or center around Malaysia (KL area by default)
                const currentLng = state.userCoords[0];
                const currentLat = state.userCoords[1];
                
                // Viewbox focused around current position / Peninsular Malaysia (minLon, minLat, maxLon, maxLat)
                const viewbox = `${currentLng - 1.5},${currentLat - 1.5},${currentLng + 1.5},${currentLat + 1.5}`;

                // Priority 1: Search within Malaysia with proximity bias
                const primaryUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=my&viewbox=${viewbox}&bounded=0&limit=7&addressdetails=1`;
                
                let response = await fetch(primaryUrl);
                let data = await response.json();

                // Priority 2: Fall back to global search if no local results matched
                if (!data || data.length === 0) {
                    const fallbackUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1`;
                    response = await fetch(fallbackUrl);
                    data = await response.json();
                }

                renderSearchResults(data);
            } catch (err) {
                console.error("Geocoding failed:", err);
            }
        }

        function renderSearchResults(results) {
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            if (!results || results.length === 0) {
                container.classList.add('hidden');
                return;
            }

            results.forEach(res => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-gray-700/80 cursor-pointer text-xs border-b border-gray-700/50 last:border-0 flex items-center gap-2.5';
                
                // Format clean label name
                const primaryName = res.display_name.split(',')[0];
                const countryCode = res.address && res.address.country_code ? res.address.country_code.toUpperCase() : 'MY';

                item.innerHTML = `
                    <i data-lucide="map-pin" class="w-4 h-4 text-blue-400 shrink-0"></i>
                    <div class="flex-1 overflow-hidden">
                        <div class="font-semibold text-white truncate">${primaryName} <span class="text-[10px] text-blue-300 font-normal ml-1">(${countryCode})</span></div>
                        <div class="text-[10px] text-gray-400 truncate">${res.display_name}</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    const coords = [parseFloat(res.lon), parseFloat(res.lat)];
                    setDestination(coords, primaryName);
                    document.getElementById('search-results').classList.add('hidden');
                });
                container.appendChild(item);
            });
            lucide.createIcons();
            container.classList.remove('hidden');
        }

        async function setDestination(coords, name = "Destination") {
            state.destinationCoords = coords;

            if (state.destMarker) state.destMarker.remove();
            
            const el = document.createElement('div');
            el.innerHTML = `<i data-lucide="map-pin" class="w-8 h-8 text-red-500 fill-red-500/20 drop-shadow-md"></i>`;
            state.destMarker = new maplibregl.Marker({ element: el })
                .setLngLat(coords)
                .addTo(state.map);
            
            lucide.createIcons();

            document.getElementById('route-dest-title').textContent = name;
            await calculateRoute();
        }

        async function calculateRoute() {
            if (!state.userCoords || !state.destinationCoords) return;

            const url = `https://router.project-osrm.org/route/v1/driving/${state.userCoords[0]},${state.userCoords[1]};${state.destinationCoords[0]},${state.destinationCoords[1]}?overview=full&geometries=geojson&steps=true`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!data.routes || data.routes.length === 0) return;

                state.routeData = data.routes[0];
                renderRouteLine(state.routeData.geometry);
                updateRouteUI(state.routeData);
            } catch (err) {
                console.error("Routing request failed:", err);
            }
        }

        function renderRouteLine(geometry) {
            if (state.map.getSource('route')) {
                state.map.getSource('route').setData({
                    type: 'Feature',
                    geometry: geometry
                });
            } else {
                state.map.addSource('route', {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: geometry
                    }
                });

                state.map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: {
                        'line-color': '#3B82F6',
                        'line-width': 6,
                        'line-opacity': 0.85
                    }
                });
            }

            const coordinates = geometry.coordinates;
            const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
            state.map.fitBounds(bounds, { padding: 80 });
        }

        function updateRouteUI(route) {
            const durationMin = Math.round(route.duration / 60);
            const distanceKm = (route.distance / 1000).toFixed(1);

            document.getElementById('route-duration').textContent = `${durationMin} min`;
            document.getElementById('route-distance').textContent = `${distanceKm} km`;

            const stepsList = document.getElementById('steps-list');
            stepsList.innerHTML = '';

            const steps = route.legs[0].steps;
            steps.forEach((step, idx) => {
                const stepEl = document.createElement('div');
                stepEl.className = 'flex items-center gap-3 p-2 bg-gray-700/30 rounded-xl text-xs';
                stepEl.innerHTML = `
                    <div class="p-1.5 bg-gray-600 rounded-lg text-blue-400">
                        <i data-lucide="${getManeuverIcon(step.maneuver.type, step.maneuver.modifier)}" class="w-4 h-4"></i>
                    </div>
                    <div class="flex-1">
                        <div class="font-medium text-white">${step.maneuver.instruction || step.name || 'Continue'}</div>
                        <div class="text-[10px] text-gray-400">${Math.round(step.distance)} meters</div>
                    </div>
                `;
                stepsList.appendChild(stepEl);
            });

            lucide.createIcons();
            document.getElementById('bottom-card').classList.remove('hidden');
        }

        function getManeuverIcon(type, modifier) {
            if (type === 'arrive') return 'flag';
            if (modifier && modifier.includes('left')) return 'arrow-left';
            if (modifier && modifier.includes('right')) return 'arrow-right';
            if (modifier && modifier.includes('uturn')) return 'rotate-ccw';
            return 'arrow-up';
        }

        function startNavigation(simulate = false) {
            if (!state.routeData) return;

            state.isNavigating = true;
            state.isSimulating = simulate;
            state.currentStepIndex = 0;
            state.lastSpokenStep = -1;

            document.getElementById('search-panel').classList.add('hidden');
            document.getElementById('bottom-card').classList.add('hidden');
            document.getElementById('nav-banner').classList.remove('hidden');
            document.getElementById('active-nav-controls').classList.remove('hidden');

            speakInstruction("Navigation started. Drive safely.");

            if (simulate) {
                runSimulation();
            }
        }

        function stopNavigation() {
            state.isNavigating = false;
            state.isSimulating = false;
            if (state.simulationInterval) clearInterval(state.simulationInterval);

            document.getElementById('search-panel').classList.remove('hidden');
            document.getElementById('nav-banner').classList.add('hidden');
            document.getElementById('active-nav-controls').classList.add('hidden');
            document.getElementById('bottom-card').classList.remove('hidden');

            state.map.easeTo({ pitch: 0, bearing: 0, zoom: 14 });
            speakInstruction("Navigation ended.");
        }

        function checkNavigationProgress(coords) {
            if (!state.routeData || !state.isNavigating) return;

            const steps = state.routeData.legs[0].steps;
            const currentStep = steps[state.currentStepIndex];

            if (!currentStep) return;

            const stepLocation = currentStep.maneuver.location;
            const distanceToStep = calculateDistance(coords, stepLocation);

            document.getElementById('nav-turn-dist').textContent = `${Math.round(distanceToStep)} m`;
            document.getElementById('nav-turn-text').textContent = currentStep.maneuver.instruction || currentStep.name || 'Follow route';

            if (distanceToStep < 80 && state.lastSpokenStep !== state.currentStepIndex) {
                speakInstruction(currentStep.maneuver.instruction);
                state.lastSpokenStep = state.currentStepIndex;
            }

            if (distanceToStep < 20 && state.currentStepIndex < steps.length - 1) {
                state.currentStepIndex++;
            }
        }

        function runSimulation() {
            const coordinates = state.routeData.geometry.coordinates;
            state.simStepIndex = 0;

            state.simulationInterval = setInterval(() => {
                if (!state.isSimulating || state.simStepIndex >= coordinates.length - 1) {
                    stopNavigation();
                    return;
                }

                const curr = coordinates[state.simStepIndex];
                const next = coordinates[state.simStepIndex + 1];

                const bearing = calculateBearing(curr, next);
                const simulatedSpeedMs = 13.8; // ~50 km/h

                updateUserPosition(next, bearing, simulatedSpeedMs);
                state.simStepIndex++;
            }, 800);
        }

        function speakInstruction(text) {
            if (!state.voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function calculateDistance(coord1, coord2) {
            const R = 6371e3;
            const φ1 = coord1[1] * Math.PI / 180;
            const φ2 = coord2[1] * Math.PI / 180;
            const Δφ = (coord2[1] - coord1[1]) * Math.PI / 180;
            const Δλ = (coord2[0] - coord1[0]) * Math.PI / 180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        function calculateBearing(start, end) {
            const startLat = start[1] * Math.PI / 180;
            const startLng = start[0] * Math.PI / 180;
            const endLat = end[1] * Math.PI / 180;
            const endLng = end[0] * Math.PI / 180;

            const dLng = endLng - startLng;
            const y = Math.sin(dLng) * Math.cos(endLat);
            const x = Math.cos(startLat) * Math.sin(endLat) -
                      Math.sin(startLat) * Math.cos(endLat) * Math.cos(dLng);

            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function centerOnUser() {
            state.followUser = true;
            state.map.flyTo({ center: state.userCoords, zoom: 16 });
        }

        function toggleMapOrientation() {
            const currentBearing = state.map.getBearing();
            state.map.easeTo({ bearing: currentBearing === 0 ? 180 : 0 });
        }

        function toggleMapTheme() {
            state.darkTheme = !state.darkTheme;
            state.map.setStyle(state.darkTheme ? MAP_STYLES.dark : MAP_STYLES.light);
            document.getElementById('theme-btn').innerHTML = `<i data-lucide="${state.darkTheme ? 'moon' : 'sun'}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }

        function toggleVoiceGuidance() {
            state.voiceEnabled = !state.voiceEnabled;
            const btn = document.getElementById('voice-btn');
            btn.classList.toggle('text-blue-400', state.voiceEnabled);
            btn.classList.toggle('text-gray-500', !state.voiceEnabled);
            btn.innerHTML = `<i data-lucide="${state.voiceEnabled ? 'volume-2' : 'volume-x'}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }

        function toggleStepsList() {
            const list = document.getElementById('steps-list');
            const icon = document.getElementById('steps-chevron');
            list.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function clearRoute() {
            if (state.map.getLayer('route-line')) state.map.removeLayer('route-line');
            if (state.map.getSource('route')) state.map.removeSource('route');
            if (state.destMarker) state.destMarker.remove();

            state.routeData = null;
            state.destinationCoords = null;
            document.getElementById('bottom-card').classList.add('hidden');
        }
    </script>
</body>
</html>
